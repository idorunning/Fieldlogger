plugins { id 'com.android.application' }

def signingFile = System.getenv('FIELDLOGGER_KEYSTORE')
def signingPassword = System.getenv('FIELDLOGGER_STORE_PASSWORD')
def signingKeyPassword = System.getenv('FIELDLOGGER_KEY_PASSWORD')
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && (!signingFile || !signingPassword || !signingKeyPassword)) {
    throw new GradleException('Release signing requires FIELDLOGGER_KEYSTORE, FIELDLOGGER_STORE_PASSWORD and FIELDLOGGER_KEY_PASSWORD. Use the private key backup; never commit credentials.')
}
android {
    namespace 'com.field.logger'
    compileSdk 36
    defaultConfig {
        applicationId 'com.field.logger'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }
    signingConfigs {
        release {
            if (signingFile) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'fieldlogger'
                keyPassword signingKeyPassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'javax.net.ssl.trustStore'].each { property ->
                def value = System.getProperty(property)
                if (value) systemProperty property, value
            }
        }
    }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
